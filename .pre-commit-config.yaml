# Install once:  uv tool install pre-commit   then   pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write .'
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json|md)$
        pass_filenames: false
